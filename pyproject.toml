[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-kb"
version = "0.1.0"
description = "Local, evidence-grounded Agentic RAG with isolated LangGraph retrieval subgraphs"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "httpx>=0.28,<1",
  "langchain-core>=1.2.5,<2", "langchain-ollama>=1.0,<2",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "qdrant-client>=1.15,<2", "langchain-text-splitters>=1.0,<2",
  "gradio>=6,<7", "pypdf>=6,<7", "python-docx>=1.2,<2",
  "numpy>=2,<3", "typer>=0.16,<1", "rich>=14,<15",
]

[project.optional-dependencies]
models = ["FlagEmbedding>=1.3.5,<2", "transformers>=4.51,<5", "torch>=2.6,<3"]
eval = [] # Legacy RAGAS runs in .venv-ragas; see docs/requirements-ragas.lock.txt.
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
agentic-kb = "agentic_kb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

